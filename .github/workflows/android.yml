name: Build PhoneCast APKs

on:
  push:
    branches: [ "main", "build-apk", "phonecast-idle-orientation-resolution", "phonecast-landscape-resize-fix", "phonecast-h264-streaming" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build both APKs
        run: gradle --no-daemon :app:assembleDebug :receiver-tv:assembleDebug
      - name: Verify APKs
        run: |
          for APK in app/build/outputs/apk/debug/app-debug.apk receiver-tv/build/outputs/apk/debug/receiver-tv-debug.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
            sha256sum "$APK"
            unzip -t "$APK" | tail -n 2
          done
      - name: Upload PhoneCast sender APK
        uses: actions/upload-artifact@v4
        with:
          name: phonecast-sender-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android TV receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: phonecast-tv-receiver-debug-apk
          path: receiver-tv/build/outputs/apk/debug/receiver-tv-debug.apk
          if-no-files-found: error
          retention-days: 14
